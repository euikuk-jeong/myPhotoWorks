name: Publish guide (GitHub Pages)

# Publishes only the guide/ folder as a static site:
#   https://<owner>.github.io/myPhotoWorks/algorithm_guide.html
on:
  push:
    branches: [main]
    paths:
      - "guide/**"
      - ".github/workflows/guide-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: guide
      - id: deployment
        uses: actions/deploy-pages@v4
